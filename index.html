<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAB4 - CSS Grid Layouts</title>
  <link rel="stylesheet" href="global.css" />
</head>
<body>

  <h2 class="titulo">Layout 1 - Fixture SA</h2>

  <div class="layout1">
    <div class="celda a">A</div>
    <div class="celda b">B</div>
    <!-- Wrapper para que C y D compartan fila en móvil -->
    <div class="cd-wrapper">
      <div class="celda c">C</div>
      <div class="celda d">D</div>
    </div>
    <div class="celda e">E</div>
  </div>

  <h2 class="titulo">Layout 2 - Header / Nav / Article / Aside / Footer</h2>

  <div class="layout2">
    <header class="celda header">header</header>
    <nav class="celda nav">nav</nav>
    <article class="celda article">article</article>
    <aside class="celda aside">aside</aside>
    <footer class="celda footer">footer</footer>
  </div>

</body>
</html>
